# ========================================
# PERFIL DE DESARROLLO (DEV)
# ========================================

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.ticketing: DEBUG
    org.springframework.web: DEBUG

# Habilitación de CORS para desarrollo local
cors:
  allowed-origins: http://localhost:4200
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true