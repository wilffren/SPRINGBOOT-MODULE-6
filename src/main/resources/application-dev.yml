# ========================================
# CONFIGURACIÓN PARA ENTORNO DE DESARROLLO
# ========================================

spring:
  # Configuración específica para desarrollo con H2 (opcional)
  # Descomentar si deseas usar H2 en lugar de MySQL para desarrollo rápido
  
  # datasource:
  #   url: jdbc:h2:mem:eventdb
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password:
  
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

  jpa:
    # En desarrollo, usar 'create-drop' o 'update'
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Habilitar CORS para desarrollo (permitir peticiones desde Angular)
cors:
  allowed-origins: http://localhost:4200
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# Logging más detallado en desarrollo
logging:
  level:
    root: INFO
    com.eventcatalog: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: INFO