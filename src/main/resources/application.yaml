spring:
  application:
    name: HU4-Task-Management
    
  datasource:
    url: jdbc:mysql://localhost:3306/hu4_tasks?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Qwe.123*
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway maneja el schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        # Configuración para detectar N+1
        generate_statistics: true
        # Batch fetching para optimización
        default_batch_fetch_size: 10
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false  # Evita lazy loading fuera de transacciones
    
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    
server:
  port: 8080
  
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.stat: DEBUG
    org.flywaydb: INFO
    com.example.HU4: DEBUG