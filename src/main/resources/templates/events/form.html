<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Nuevo Evento</title>

    <!-- 🎨 Estilos integrados -->
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            background: #fff;
            margin: 40px auto;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-top: 12px;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        input[type="datetime-local"],
        textarea,
        select {
            padding: 8px 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button, a.button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }

        button:hover, a.button:hover {
            background-color: #0056b3;
        }

        a.cancel {
            background-color: #6c757d;
        }

        a.cancel:hover {
            background-color: #5a6268;
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
        }

        .form-footer a {
            color: #007bff;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${event.id} == null ? 'Crear Nuevo Evento' : 'Editar Evento'"></h1>

    <form th:action="@{/web/events/save}" th:object="${event}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <label for="name">Nombre del Evento:</label>
        <input type="text" id="name" th:field="*{name}" required/>

        <label for="description">Descripción:</label>
        <textarea id="description" th:field="*{description}" rows="3" required></textarea>

        <label for="category">Categoría:</label>
        <input type="text" id="category" th:field="*{category}" required/>

        <label for="city">Ciudad:</label>
        <input type="text" id="city" th:field="*{city}" required/>

        <label for="eventDate">Fecha y hora:</label>
        <input type="datetime-local" id="eventDate"
               th:field="*{eventDate}"
               th:value="${event.eventDate != null} ? ${#dates.format(event.eventDate, 'yyyy-MM-dd\'T\'HH:mm')} : ''"
               required/>

        <label for="price">Precio:</label>
        <input type="number" id="price" th:field="*{price}" step="0.01" required/>

        <label for="availableTickets">Entradas disponibles:</label>
        <input type="number" id="availableTickets" th:field="*{availableTickets}" required/>

        <label for="imageUrl">URL de la imagen:</label>
        <input type="text" id="imageUrl" th:field="*{imageUrl}" placeholder="https://..."/>

        <label for="status">Estado:</label>
        <select id="status" th:field="*{status}">
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
        </select>

        <div class="button-group">
            <button type="submit">Guardar</button>
            <a th:href="@{/web/events}" class="button cancel">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
