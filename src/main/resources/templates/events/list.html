<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Listado de Eventos</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container mt-4">
        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>🎟️ Catálogo de Eventos</h2>
            
        </div>

        <!-- Tabla de eventos -->
        <div class="card shadow">
            <div class="card-body table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Ciudad</th>
                            <th>Fecha</th>
                            <th>Precio</th>
                            <th>Entradas</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="event : ${events}">
                            <td th:text="${event.id}">1</td>
                            <td th:text="${event.name}">Concierto</td>
                            <td th:text="${event.category}">Concierto</td>
                            <td th:text="${event.city}">Bogotá</td>
                            <td th:text="${#temporals.format(event.eventDate, 'dd/MM/yyyy HH:mm')}">2025-12-15 20:00</td>
                            <td th:text="${#numbers.formatDecimal(event.price, 0, 'COMMA', 2, 'POINT')}">$100.00</td>
                            <td th:text="${event.availableTickets}">500</td>
                            <td>
                                <a th:href="@{'/web/events/' + ${event.id} + '/edit'}" class="btn btn-sm btn-warning">✏️ Editar</a>
                                <a th:href="@{'/web/events/' + ${event.id} + '/delete'}"
                                   onclick="return confirm('¿Seguro que deseas eliminar este evento?')"
                                   class="btn btn-sm btn-danger">🗑️ Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(events)}">
                            <td colspan="8" class="text-center text-muted py-4">No hay eventos registrados</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
</body>
</html>
